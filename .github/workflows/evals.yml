name: Evals

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  evals:
    # A pull request from a fork gets no secrets, so the job runs only for branches of this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TELEMETRY_DEV_API_KEY: ${{ secrets.TELEMETRY_DEV_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - uses: telemetry-dev/telemetry/actions/experiment@experiment-action-v1
        with:
          dataset: support-golden
          script: evals/reply.eval.ts
          min-scores: correctness=0.9
